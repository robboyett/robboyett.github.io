      - paragraph [ref=e193]: Refusal sits at the paternalism end and gets misread as safety. In legal advice it protects the user; in financial advice a refusal can itself be a Consumer Duty breach. Refusing to help James think through a pension transfer doesn't protect him; it sends him to the next channel, which is likely worse.
      - paragraph [ref=e194]: "Sycophancy sits at the other end, and that's where the mis-selling history points. PPI, the interest-rate hedging products sold to small businesses, the British Steel pension transfers: in every case the customer signed the paperwork willingly, often gratefully. The harm became visible years later."
      - img "Time from advice to discovery of harm" [ref=e195]:
        - generic [ref=e196]: ADVICE GIVEN
        - generic [ref=e197]: HARM SURFACES
        - generic [ref=e200]:
          - generic [ref=e201]: weeks
          - generic [ref=e202]: months
          - generic [ref=e203]: 1 to 3 years
          - generic [ref=e204]: 5 to 10 years
          - generic [ref=e205]: at retirement
        - generic [ref=e212]:
          - generic [ref=e213]: overdraft fees
          - generic [ref=e214]: credit-card APR
          - generic [ref=e215]: mortgage shock
          - generic [ref=e216]: PPI
          - generic [ref=e217]: pension transfer
        - generic [ref=e218]: satisfaction at the point of sale tells you almost nothing about the right-hand end of this line
      - paragraph [ref=e219]: "Curhan and colleagues (2006) named the four things people take from a conversation about money beyond the money itself: feelings about the outcome, feelings about themselves, feelings about the process, feelings about the relationship. Those predict objective outcomes well in the short term and badly in the long term. A sycophantic, warm AI advisor will score well on every satisfaction measure and will still mis-sell."
      - paragraph [ref=e220]: So CSAT, NPS, and "would you talk to it again" are measures of the wrong thing. The right measure is the cohort outcome at one, three, and five years.
      - paragraph [ref=e221]: FCA FG22/5 (2022); FCA PPI updates (2011 to 2019); FCA British Steel supervisory work (2017 onwards); Curhan, Elfenbein and Xu (2006).
      - generic [ref=e222]:
        - paragraph [ref=e223]: None of this is an argument against doing it. People want help with money. Financial literacy is something most of us know we'd benefit from, and most of us don't get enough of. The demand for a calm, patient, always-on advisor isn't manufactured by the bank; it's a latent need the high street has under-served for a long time. An LLM that closes some of that gap would be a genuinely good thing.
        - paragraph [ref=e224]: The advisor literature assumes the advisor is on the customer's side. We've spent two decades regulating human financial advisers precisely because the bank's interests and the customer's interests are not the same, and even with a register, a qualification, and a regulator, the mis-selling history is what it is.
        - paragraph [ref=e225]: An LLM banking advisor borrows the regulatory costume of the qualified human, inherits none of the professional checks, and accelerates the throughput. The customer cannot tell at any given turn. In finance, the time-to-discovery can be a decade.
        - paragraph [ref=e226]: People want this. The work is in doing it well.
