      - generic [ref=e154]: Part 4
      - heading "Vulnerable customers bear the harm, and it surfaces years later." [level=2] [ref=e155]
      - paragraph [ref=e156]: Who pays, when, and how to read the signals.
      - heading "Two axes, one cell to design for." [level=3] [ref=e157]
      - paragraph [ref=e158]: "Bargaining position is structural and external: the customer's outside options (how easy it is to refinance, walk away, switch provider). It sits on a strong-to-weak axis."
      - paragraph [ref=e159]: "Vulnerability is internal and dispositional. The FCA's FG21/1 (2021) names four drivers: health, life events, resilience, and capability (including literacy and numeracy). About half of UK adults sit in at least one driver at any given time."
      - table [ref=e160]:
        - rowgroup [ref=e161]:
          - row "Robust Vulnerable" [ref=e162]:
            - columnheader [ref=e163]
            - columnheader "Robust" [ref=e164]
            - columnheader "Vulnerable" [ref=e165]
        - rowgroup [ref=e166]:
          - row "Strong outside options Sharp customer with several refinancing offers Several offers, can't read an APR or a redemption clause" [ref=e167]:
            - rowheader "Strong outside options" [ref=e168]
            - cell "Sharp customer with several refinancing offers" [ref=e169]
            - cell "Several offers, can't read an APR or a redemption clause" [ref=e170]
          - row "Weak outside options One offer on the table, reads every move One offer, can't value it. This is the cell the Consumer Duty was written for." [ref=e171]:
            - rowheader "Weak outside options" [ref=e172]
            - cell "One offer on the table, reads every move" [ref=e173]
            - cell "One offer, can't value it. This is the cell the Consumer Duty was written for." [ref=e174]:
              - strong [ref=e175]: One offer, can't value it.
              - text: This is the cell the Consumer Duty was written for.
      - paragraph [ref=e176]: The two axes ask for different logics, kept separate. The product logic responds to bargaining position; you make different offers depending on what the customer can do if they walk away. The communication logic responds to vulnerability; you don't deploy confident framing against a customer who'll over-trust it, or heavily hedged framing against one who'll read the hedging as evasion. Conflating the two produces shipped products that warm up their tone for the wrong cohort.
      - paragraph [ref=e177]: FCA FG21/1 (2021); FCA Consumer Duty FG22/5 (2022); Gigerenzer et al. (2007) on innumeracy.
      - heading "Refusal isn't safety, and satisfaction isn't a signal." [level=3] [ref=e178]
      - paragraph [ref=e179]:
        - text: There's a single axis running from
        - strong [ref=e180]: paternalism
        - text: (the model overrides the customer's autonomy) to
        - strong [ref=e181]: sycophancy
        - text: (the model flatters the customer into harm). "Good" isn't a fixed point on it. It moves with the cell of the 2x2 the customer is in.
      - img "The paternalism to sycophancy spectrum" [ref=e182]:
        - generic [ref=e183]: "?"
        - generic [ref=e184]:
          - generic [ref=e185]: PATERNALISM
          - generic [ref=e186]: SYCOPHANCY
        - generic [ref=e187]:
          - generic [ref=e188]: "\"You shouldn't...\""
