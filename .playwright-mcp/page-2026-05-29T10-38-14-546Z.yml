      - heading "Reflections for designers of AI advisors in banking" [level=1] [ref=e17]
      - paragraph [ref=e18]: For HCI and product practitioners working in retail finance.
      - generic [ref=e19]:
        - button "Copy as Markdown" [ref=e20] [cursor=pointer]:
