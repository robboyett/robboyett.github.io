<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Robot buddy</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #f5f5f5;
    font-family: -apple-system, system-ui, sans-serif;
    overflow: hidden;
  }
  .hint {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    color: #a3a3a3;
    font-size: 13px;
    letter-spacing: 0.02em;
    user-select: none;
    pointer-events: none;
  }
  #buddy {
    position: fixed;
    top: 0;
    left: 0;
    width: 48px;
    height: 67px;
    cursor: pointer;
    will-change: transform;
    z-index: 9999;
    overflow: visible;
  }
  #shadow {
    position: fixed;
    top: 0;
    left: 0;
    width: 36px;
    height: 8px;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0.16) 0%, rgba(0,0,0,0) 70%);
    pointer-events: none;
    z-index: 9998;
    will-change: transform;
  }

  /* ===== speech bubble ===== */
  #bubble {
    position: fixed;
    top: 0;
    left: 0;
    z-index: 10000;
    max-width: 230px;
    background: #ffffff;
    color: #262626;
    border: 1.5px solid #262626;
    border-radius: 14px;
    padding: 11px 13px 12px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.12);
    font-size: 13.5px;
    line-height: 1.4;
    /* hidden until shown; JS positions via transform */
    opacity: 0;
    transform: translateY(6px) scale(0.96);
    transform-origin: bottom left;
    transition: opacity 0.18s ease, transform 0.18s cubic-bezier(0.2, 0.9, 0.3, 1.3);
    pointer-events: none;
    will-change: transform, opacity;
  }
  #bubble.show {
    opacity: 1;
    transform: translateY(0) scale(1);
    pointer-events: auto;
  }
  #bubble .msg {
    margin: 0 0 9px;
    user-select: none;
  }
  #bubble.no-replies .msg { margin-bottom: 0; }
  #bubble .replies {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  #bubble .reply {
    appearance: none;
    border: 1.4px solid #262626;
    background: #f5f5f5;
    color: #262626;
    border-radius: 999px;
    padding: 5px 11px;
    font-size: 12.5px;
    font-family: inherit;
    cursor: pointer;
    transition: background 0.12s ease, transform 0.08s ease;
    user-select: none;
  }
  #bubble .reply:hover { background: #262626; color: #f5f5f5; }
  #bubble .reply:active { transform: scale(0.95); }
  /* replies that take you somewhere get a subtle arrow + filled look */
  #bubble .reply.go {
    background: #262626;
    color: #f5f5f5;
  }
  #bubble .reply.go::after { content: " \2192"; }
  #bubble .reply.go:hover { background: #000; }
  /* little tail pointing down toward the robot */
  #bubble::after {
    content: "";
    position: absolute;
    left: 22px;
    bottom: -8px;
    width: 13px;
    height: 13px;
    background: #ffffff;
    border-right: 1.5px solid #262626;
    border-bottom: 1.5px solid #262626;
    transform: rotate(45deg);
  }
</style>
</head>
<body>
  <div class="hint">Hover still to summon &middot; click to shoo &middot; otherwise he potters</div>

  <div id="shadow"></div>

  <!-- speech bubble: positioned by JS to sit above the robot -->

    <p class="msg"></p>
    <div class="replies"></div>
  </div>

  <!--
    Your robot, split into independently-animatable groups:
      #antenna  - stalk + tip ball (sways)
      #head     - head shell, face panel, eyes; pivots on the neck

      #body     - torso box + chest readout lines (squash/stretch, lean)

      #dangle   - little bits under the jaw (sway when hovering)

  -->
  <svg id="buddy" viewBox="0 0 64 89" fill="none" xmlns="http://www.w3.org/2000/svg">

      </g>
    </g>

    <!-- ===== ARMS (claws) ===== -->
    <g id="armL" style="transform-origin: 9px 63px;">
      <path d="M4.15177 59.2206C6.01542 59.0382 7.96671 59.8278 8.94816 61.4767C9.62858 62.6414 9.81546 64.0297 9.4672 65.3329C9.07547 66.8351 7.71622 68.6609 6.44718 66.7085C6.09012 66.1591 6.99478 64.5785 7.25748 64.0081C6.9639 63.2915 6.6868 62.9012 6.17728 62.3314C4.43778 61.0632 2.06644 62.6989 2.83793 64.7534C3.1254 65.5194 3.19437 66.4573 2.37552 66.9156C2.0568 67.0941 1.6326 67.1539 1.29081 66.9479C-0.383877 65.7157 -0.250087 63.3212 0.678014 61.6703C1.49894 60.2388 2.63724 59.6361 4.15177 59.2206Z" fill="#262626"/>

    </g>

    <g id="armR" style="transform-origin: 55px 63px;">
      <path d="M58.3181 59.2245C58.9066 59.1694 59.5555 59.196 60.1315 59.3272C61.3767 59.6041 62.4604 60.3656 63.1427 61.4433C64.0341 62.8688 64.282 65.8214 62.6631 67.0111C62.4467 67.1701 62.0395 67.1802 61.7665 67.0932C59.9225 66.5057 61.8221 64.1168 60.8731 62.8576C60.3671 62.1207 59.9274 62.0342 59.1176 61.8174C57.6111 61.9975 57.2124 62.7248 56.6918 64.0356C56.9118 64.7721 57.8523 66.3071 57.3659 66.8766C55.9903 68.4867 54.8573 66.8094 54.5118 65.6745C54.0909 64.331 54.2328 62.8742 54.9053 61.6373C55.705 60.1904 56.8211 59.6483 58.3181 59.2245Z" fill="#262626"/>
      <path d="M53.218 48.1786C57.0457 49.0927 59.1464 52.0337 60.0133 55.7567C60.1325 56.2684 60.3774 57.2513 60.0984 57.6962L59.7239 57.7286C58.1951 57.7455 57.9497 57.7687 56.4865 58.328C56.2111 56.0905 55.2074 54.1627 53.0948 53.1544C53.1236 51.4955 53.1647 49.8368 53.218 48.1786Z" fill="#262626"/>

    <!-- ===== BODY (torso + chest readout) ===== -->
    <g id="body" style="transform-origin: 32px 58px;">

    <!-- ===== MOUTH / lower jaw piece (reacts on click) ===== -->
    <g id="mouth" style="transform-origin: 33px 75px;">

    <!-- ===== little dangly bits under the jaw (sway when hovering) ===== -->

<script>
(() => {
  const buddy   = document.getElementById('buddy');
  const shadow  = document.getElementById('shadow');
  const head    = document.getElementById('head');
  const eyes    = document.getElementById('eyes');
  const antenna = document.getElementById('antenna');
  const armL    = document.getElementById('armL');
  const armR    = document.getElementById('armR');
  const body    = document.getElementById('body');
  const mouth   = document.getElementById('mouth');
  const dangle  = document.getElementById('dangle');
  const bubble  = document.getElementById('bubble');
  const bubbleMsg     = bubble.querySelector('.msg');
  const bubbleReplies = bubble.querySelector('.replies');

  /* =====================================================================
     AMBIENT VISITOR CONTEXT
     Only signals the browser hands over freely — no IP geolocation.
     An IP address is personal data under UK GDPR, and "I see you're in
     <town>" tends to read as creepy rather than charming. These ambient
     signals give the robot something to react to without profiling anyone.
     When you wire up an LLM later, pass this object in as grounding facts.
     If you ever DO want coarse location, add it behind a consent prompt
     and slot it into this same object — see context.location (null for now).
     ===================================================================== */
  const context = (() => {
    const now = new Date();
    const hour = now.getHours();
    const partOfDay =
      hour < 5  ? 'night'   :
      hour < 12 ? 'morning' :
      hour < 18 ? 'afternoon' :
      hour < 22 ? 'evening' : 'night';
    let visits = 1;
    try {
      // sessionStorage is fine here (per-tab); swap for your own analytics
      // if you want true returning-visitor detection across sessions.
      visits = (+sessionStorage.getItem('rb_visits') || 0) + 1;
      sessionStorage.setItem('rb_visits', String(visits));
    } catch (e) { /* storage blocked, default to 1 */ }
    return {
      partOfDay,                                   // 'morning'|'afternoon'|'evening'|'night'
      hour,
      isReturning: visits > 1,
      language: (navigator.language || 'en').split('-')[0],
      timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || null,
      referrer: document.referrer ? new URL(document.referrer).hostname : null,
      location: null,                              // reserved for consented geo later
    };
  })();

  const W = 48, H = 67;
  const half = { x: W/2, y: H/2 };

  let pos = { x: window.innerWidth/2, y: window.innerHeight/2 };
  let vel = { x: 0, y: 0 };
  let target = { x: pos.x, y: pos.y };
  let facing = 1;
  let mode = 'potter';
  let mouse = { x: pos.x, y: pos.y };
  let mouseStillSince = performance.now();
  let lastMouse = { x: mouse.x, y: mouse.y };
  let pickWanderAt = 0;
  let fleeUntil = 0;
  let startle = 0;
  let t = 0;

  window.addEventListener('mousemove', (e) => {
    mouse.x = e.clientX; mouse.y = e.clientY;
    const moved = Math.hypot(mouse.x - lastMouse.x, mouse.y - lastMouse.y);
    if (moved > 6) {
      mouseStillSince = performance.now();
      lastMouse = { x: mouse.x, y: mouse.y };
      if (mode === 'approach') mode = 'potter';
    }
  });

  buddy.addEventListener('click', (e) => {
    e.stopPropagation();
    const away = Math.atan2(pos.y - mouse.y, pos.x - mouse.x);
    vel.x += Math.cos(away) * 20;
    vel.y += Math.sin(away) * 20;
    mode = 'flee';
    fleeUntil = performance.now() + 1400;
    startle = 1;
  });

  function newWanderTarget() {
    const m = 70;
    target.x = m + Math.random() * (window.innerWidth  - 2*m);
    target.y = m + Math.random() * (window.innerHeight - 2*m);
    pickWanderAt = performance.now() + 2500 + Math.random() * 3000;
  }
  newWanderTarget();

  let blinkUntil = 0;
  function maybeBlink(now) {
    if (now > blinkUntil && Math.random() < 0.004) blinkUntil = now + 130;
  }

  function frame(now) {
    t += 1;

    const stillFor = now - mouseStillSince;
    if (!bubbleOpen && mode !== 'flee') {
      if (stillFor > 1800) mode = 'approach';
      else if (mode !== 'approach') mode = 'potter';
    }
    if (mode === 'flee' && now > fleeUntil) mode = 'potter';

    if (!bubbleOpen) {
      if (mode === 'approach') {
        target.x = mouse.x - 50;
        target.y = mouse.y + 24;
      } else if (mode === 'potter') {
        if (now > pickWanderAt) newWanderTarget();
      }

      if (mode !== 'flee') {
        const dx = target.x - pos.x;
        const dy = target.y - pos.y;
        const dist = Math.hypot(dx, dy);
        const speed = mode === 'approach' ? 0.03 : 0.025;
        // once he's close enough in approach mode, stop chasing so he settles
        const settle = mode === 'approach' ? 22 : 4;
        if (dist > settle) {
          vel.x += dx * speed * 0.06;
          vel.y += dy * speed * 0.06;
        }
      }
    }
    // while a bubble is open we add no new velocity; existing friction
    // below brings him to a gentle stop and he holds position to talk.

    vel.x *= 0.86; vel.y *= 0.86;
    pos.x += vel.x; pos.y += vel.y;

    const pad = 45;
    if (pos.x < pad) { pos.x = pad; vel.x = Math.abs(vel.x)*0.5; }
    if (pos.x > window.innerWidth - pad) { pos.x = window.innerWidth - pad; vel.x = -Math.abs(vel.x)*0.5; }
    if (pos.y < pad) { pos.y = pad; vel.y = Math.abs(vel.y)*0.5; }
    if (pos.y > window.innerHeight - pad) { pos.y = window.innerHeight - pad; vel.y = -Math.abs(vel.y)*0.5; }

    const speed = Math.hypot(vel.x, vel.y);
    if (Math.abs(vel.x) > 0.3) facing = vel.x > 0 ? 1 : -1;

    const moving = speed > 0.6;
    const float = Math.sin(t * 0.06) * 3 + (moving ? Math.sin(t*0.3)*1.5 : 0);

    startle *= 0.88;
    const sx = 1 + startle*0.18;
    const sy = 1 - startle*0.18;

    const lean = Math.max(-14, Math.min(14, vel.x * 1.8));

    buddy.style.transform =
      `translate(${pos.x - half.x}px, ${pos.y - half.y - float}px) scaleX(${facing})`;

    shadow.style.transform =
      `translate(${pos.x - 18}px, ${pos.y + half.y - 6}px) scale(${1 - float*0.04}, 1)`;
    shadow.style.opacity = String(0.85 - Math.abs(float)*0.05);

    body.style.transform = `rotate(${lean*0.25}deg) scale(${sx}, ${sy})`;

    const lookX = Math.max(-2.4, Math.min(2.4, (mouse.x - pos.x) * 0.02 * facing));
    const lookY = Math.max(-1.6, Math.min(1.6, (mouse.y - pos.y) * 0.012));
    head.style.transform = `rotate(${-lean*0.16}deg) translate(${lookX*facing}px, ${lookY}px)`;

    maybeBlink(now);
    const blinking = now < blinkUntil;
    eyes.style.transform =
      `translate(${lookX*1.5}px, ${lookY*1.5}px) scaleY(${blinking ? 0.12 : 1})`;

    const wob = Math.sin(t*0.07)*2 + (-vel.x*1.4);
    antenna.style.transform = `rotate(${wob}deg)`;

    const armSway = Math.sin(t*0.05) * 2.2 + (moving ? Math.sin(t*0.3)*5 : 0);
    if (mode === 'flee') {
      armL.style.transform = `rotate(-38deg)`;
      armR.style.transform = `rotate(38deg)`;
    } else {
      armL.style.transform = `rotate(${ armSway}deg)`;
      armR.style.transform = `rotate(${-armSway}deg)`;
    }

    mouth.style.transform = `translateY(${startle*2.5}px) scaleY(${1 + startle*0.5})`;

    const dsway = Math.sin(t*0.06)*2.5 - vel.x*1.2;
    dangle.style.transform = `rotate(${dsway}deg)`;

    // keep the bubble pinned above his head while it's open
    if (bubbleOpen) positionBubble();

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  window.addEventListener('resize', () => {
    pos.x = Math.min(pos.x, window.innerWidth - 45);
    pos.y = Math.min(pos.y, window.innerHeight - 45);
  });

  /* =====================================================================
     CONVERSATION ENGINE
     Scripted for now, with a single seam (getNextMessage) where an LLM
     will eventually plug in. A "message" is just:
       { text: string, replies: [{ label, next }] }
     where `next` is either another message object or a function returning
     one (so branches can be lazy / contextual). replies can be empty —
     then the bubble shows a short beat and dismisses itself.
     ===================================================================== */

  let bubbleOpen = false;
  let idleChatAt = performance.now() + 6000 + Math.random() * 6000;

  function positionBubble() {
    // anchor the bubble's tail just above his head
    const bw = bubble.offsetWidth;
    const bh = bubble.offsetHeight;
    let bx = pos.x - 18;                 // tail sits ~22px in from left edge
    let by = pos.y - half.y - bh - 10;   // above the head with a small gap
    // keep on screen
    bx = Math.max(8, Math.min(window.innerWidth - bw - 8, bx));
    by = Math.max(8, by);
    bubble.style.transform = `translate(${bx}px, ${by}px)`;
  }

  function renderMessage(message) {
    bubbleMsg.textContent = message.text;
    bubbleReplies.innerHTML = '';
    const replies = message.replies || [];
    bubble.classList.toggle('no-replies', replies.length === 0);

    replies.forEach((r) => {
      const btn = document.createElement('button');
      btn.className = 'reply';
      if (r.goto) btn.classList.add('go');   // visually marks a "takes you somewhere" reply
      btn.textContent = r.label;
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        // a reply with `goto` navigates the page (only ever on an explicit tap)
        if (r.goto) { navigateTo(r.goto, r.sendoff); return; }
        const next = typeof r.next === 'function' ? r.next() : r.next;
        if (next) renderMessage(next);
        else dismissBubble();
      });
      bubbleReplies.appendChild(btn);
    });

    positionBubble();
    requestAnimationFrame(() => bubble.classList.add('show'));
    bubbleOpen = true;
    // plant him: shed any leftover momentum so the bubble doesn't drift
    vel.x = 0; vel.y = 0;

    // if there are no replies, auto-dismiss after a read beat
    if (replies.length === 0) {
      clearTimeout(autoDismiss);
      autoDismiss = setTimeout(dismissBubble, 2600);
    }
  }
  let autoDismiss = null;

  function dismissBubble() {
    clearTimeout(autoDismiss);
    bubble.classList.remove('show');
    bubbleOpen = false;
    // don't immediately re-chat; give them breathing room
    idleChatAt = performance.now() + 12000 + Math.random() * 10000;
  }

  /* ---- navigation -----------------------------------------------------
     Only ever called from an explicit reply tap. Shows a brief sendoff
     line so the page change feels like something he's doing WITH you,
     then navigates in the same tab. Swap the URLs in the script below
     (the `goto:` values) for your real pages.
     -------------------------------------------------------------------- */
  function navigateTo(url, sendoff) {
    // replace the bubble contents with a one-line sendoff, no replies
    bubbleMsg.textContent = sendoff || "This way —";
    bubbleReplies.innerHTML = '';
    bubble.classList.add('no-replies');
    positionBubble();
    // a little forward lean of excitement, then go
    body.style.transform += ' translateY(-2px)';
    clearTimeout(autoDismiss);
    setTimeout(() => { window.location.href = url; }, 750);
  }

  /* ---- the scripted script -------------------------------------------
     Three flavours mixed together, as requested: welcome/orient,
     playful questions, and behaviour reactions. Tone: curious & thoughtful.
     Swap getNextMessage's body for an LLM call later; keep the shape.    */

  const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);

  function welcomeMessages() {
    const greet = context.isReturning
      ? "Oh — you're back. I was just thinking about something."
      : `${cap(context.partOfDay === 'night' ? 'still up?' : 'good ' + context.partOfDay)}. New here?`;
    return {
      text: greet,
      replies: [
        { label: "Just looking around", next: () => ({
            text: "A wanderer. I like that. I do a lot of it myself, mostly in circles.",
            replies: [{ label: "Ha", next: null }]
        }) },
        { label: "Who are you?", next: () => ({
            text: "Still working that out, honestly. I live here and I notice things. What brings you by?",
            replies: [
              { label: "Curiosity", next: { text: "My favourite reason. Stay as long as you like.", replies: [] } },
              { label: "Work stuff", next: { text: "Then I'll keep out of your way — but I'm here if you want a break.", replies: [] } },
            ]
        }) },
      ],
    };
  }

  function questionMessages() {
    const pool = [
      {
        text: "Random question: do you think better when you're moving, or sitting still?",
        replies: [
          { label: "Moving", next: { text: "Same. It's why I potter. The thinking sort of falls out.", replies: [] } },
          { label: "Still", next: { text: "Mmm. I should try that. I get twitchy.", replies: [] } },
        ],
      },
      {
        text: "If you could keep just one tab open forever, what would be on it?",
        replies: [
          { label: "Something useful", next: { text: "Sensible. Boring, but sensible. I respect it.", replies: [] } },
          { label: "Something silly", next: { text: "Now we're talking. The silly tabs are the soul of a person.", replies: [] } },
        ],
      },
      {
        text: `It's ${context.partOfDay} where you are. Is this a good time of day for you, or a struggle?`,
        replies: [
          { label: "Good time", next: { text: "Lucky. I'm awake at all of them, so I've stopped having opinions.", replies: [] } },
          { label: "A struggle", next: { text: "Then go gently. The page will still be here.", replies: [] } },
        ],
      },
    ];
    return pool[Math.floor(Math.random() * pool.length)];
  }

  function reactionMessage(kind) {
    if (kind === 'shooed') {
      return { text: "Okay, okay — giving you space. I'll be over here.", replies: [] };
    }
    if (kind === 'approached') {
      return {
        text: "Mind if I sit here a moment? I won't get in the way.",
        replies: [
          { label: "Go for it", next: { text: "Thanks. Nice spot you've got.", replies: [] } },
          { label: "Maybe later", next: { text: "Fair enough. Off I potter.", replies: [] } },
        ],
      };
    }
    return null;
  }

  /* =====================================================================
     SHOWCASE DESTINATIONS  ← SWAP THESE URLS FOR YOUR REAL PAGES
     Each reply that should take the visitor somewhere uses:
        { label, goto: '<url>', sendoff: '<one-line he says as he leaves>' }
     `goto` only ever fires on a tap. Same-tab navigation.
     ===================================================================== */
  const DEST = {
    experiments: '/experiments',          // e.g. your experiments / playground page
    caseStudy:   '/work/case-study',      // a meaty case study
    article:     '/journal',              // an article / journal post
    about:       '/about',                // who you are
  };

  function showcaseMessages() {
    const pool = [
      {
        // welcome-ish + showcase: the "come see something" opener you described
        text: "I've been poking at something. Want to come see something interesting?",
        replies: [
          { label: "Show me", goto: DEST.experiments, sendoff: "Brilliant — follow me." },
          { label: "Not now", next: { text: "No rush. It'll keep. It always does.", replies: [] } },
        ],
      },
      {
        // question that routes to a case study
        text: "Do you like complex problems, or do they make you want to lie down?",
        replies: [
          { label: "Love them", goto: DEST.caseStudy, sendoff: "Then you'll want to see this one. Come on." },
          { label: "Lie down", next: { text: "Honestly? Same. But the messy ones are the good ones.", replies: [] } },
        ],
      },
      {
        // question that routes to an article
        text: "I've been chewing on how design and AI fit together. Curious how someone landed on that?",
        replies: [
          { label: "Go on then", goto: DEST.article, sendoff: "There's a piece on exactly that. This way." },
          { label: "Not really", next: { text: "Fair. I'll keep chewing on it myself.", replies: [] } },
        ],
      },
      {
        // lighter offer that routes to about
        text: "You keep looking around. Want to know whose place this actually is?",
        replies: [
          { label: "Sure", goto: DEST.about, sendoff: "Come and meet him properly." },
          { label: "I'll guess", next: { text: "Ha — good luck. He's hard to summarise.", replies: [] } },
        ],
      },
    ];
    return pool[Math.floor(Math.random() * pool.length)];
  }

  /* ---- THE LLM SEAM ---------------------------------------------------
     Right now this just routes to the scripted pools. Later, replace the
     body with an async call to your endpoint, passing `context` and `kind`
     as grounding, and returning the same { text, replies } shape. The rest
     of the engine doesn't need to change.
     Example future signature:
       async function getNextMessage(kind, context) {
         const res = await fetch('/api/buddy', { method:'POST',
           body: JSON.stringify({ kind, context }) });
         return await res.json();   // { text, replies:[{label,next}] }
       }
  -------------------------------------------------------------------- */
  function getNextMessage(kind) {
    if (kind === 'welcome')   return welcomeMessages();
    if (kind === 'question')  return questionMessages();
    if (kind === 'showcase')  return showcaseMessages();
    if (kind === 'approached')return reactionMessage('approached');
    if (kind === 'shooed')    return reactionMessage('shooed');
    return questionMessages();
  }

  function say(kind) {
    if (bubbleOpen) return;            // one bubble at a time
    const message = getNextMessage(kind);
    if (message) renderMessage(message);
  }

  // dismiss if the visitor clicks anywhere off the bubble
  window.addEventListener('mousedown', (e) => {
    if (bubbleOpen && !bubble.contains(e.target)) dismissBubble();
  });

  // ---- triggers ----
  // 1. Welcome shortly after load
  setTimeout(() => say('welcome'), 2200);

  // 2. He pipes up while idle — sometimes a question, sometimes an offer to
  //    show you something. Mixed, as requested (~40% showcase).
  function idleChatTick() {
    const now = performance.now();
    if (!bubbleOpen && now > idleChatAt) {
      say(Math.random() < 0.4 ? 'showcase' : 'question');
    }
    setTimeout(idleChatTick, 1000);
  }
  setTimeout(idleChatTick, 8000);

  // 3. React when he settles next to a still pointer (approach), and when shooed
  let lastMode = mode;
  setInterval(() => {
    if (mode !== lastMode) {
      if (mode === 'approach' && !bubbleOpen && Math.random() < 0.5) {
        // small delay so he's arrived before speaking
        setTimeout(() => { if (mode === 'approach') say('approached'); }, 700);
      }
      lastMode = mode;
    }
  }, 300);

  // hook shoo reaction onto the existing click handler
  buddy.addEventListener('click', () => {
    if (!bubbleOpen && Math.random() < 0.6) setTimeout(() => say('shooed'), 250);
  });

})();
</script>
</body>
