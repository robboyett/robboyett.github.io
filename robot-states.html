<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Robot buddy — states sandbox</title>
<style>
  /* ------------------------------------------------------------------
     STATES SANDBOX — design surface for the robot buddy's expressions.
     This is a standalone mirror of production. The SVG art, the CSS state
     rules, and the per-state motion numbers below are kept identical to
     components/robot-buddy.js + components/robot-buddy.css. Tweak here,
     then the finalised values get ported back into those two files.
     ------------------------------------------------------------------ */
  :root {
    --bg: #f4f4f5;
    --card: #ffffff;
    --ink: #18181b;
    --muted: #71717a;
    --line: #e4e4e7;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 32px 24px 64px;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  header {
    max-width: 1100px;
    margin: 0 auto 28px;
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
  }
  header h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -0.01em; }
  header p { margin: 0; color: var(--muted); font-size: 13.5px; max-width: 560px; line-height: 1.45; }
  .controls { display: flex; gap: 16px; align-items: center; font-size: 13px; color: var(--muted); }
  .controls label { display: flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; }

  .grid {
    max-width: 1100px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 18px;
    align-items: start;
  }
  .tile {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 20px 16px 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
    scroll-margin-top: 24px;
  }
  .stage {
    position: relative;
    width: 100%;
    height: 210px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .robot-wrap { position: relative; width: 122px; height: 170px; }
  .broken-wrap { width: 168px; height: 132px; }
  .rb-broken { display: block; width: 168px; height: auto; overflow: visible; }
  .broken-wrap .tile-shadow { width: 104px; margin-left: -52px; bottom: 2px; }
  .tile-shadow {
    position: absolute;
    left: 50%;
    margin-left: -33px;
    bottom: -6px;
    width: 66px;
    height: 12px;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0.16) 0%, rgba(0,0,0,0) 70%);
  }
  .caption { text-align: center; margin-top: 6px; }
  .caption .name { font-weight: 600; font-size: 15px; }
  .caption .note { color: var(--muted); font-size: 12.5px; margin-top: 3px; line-height: 1.35; }
  .caption .cls {
    display: inline-block;
    margin-top: 8px;
    font-family: ui-monospace, 'SF Mono', Menlo, monospace;
    font-size: 11px;
    color: #52525b;
    background: #f4f4f5;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 2px 7px;
  }

  /* ---- The robot ---- */
  .rb-buddy { width: 122px; height: 170px; overflow: visible; will-change: transform; transform-origin: 50% 62%; }
  .rb-head, .rb-antenna, .rb-eyes, .rb-armL, .rb-armR, .rb-body, .rb-mouth, .rb-dangle { will-change: transform; }

  /* ---- State face-swaps (mirror of robot-buddy.css) ---- */
  .rb-eyes-happy, .rb-eyes-angry, .rb-eyes-cross, .rb-eyes-flat, .rb-steam { display: none; }

  .exp-thinking .rb-eyes { display: none; }
  .exp-thinking .rb-eyes-happy { display: block; }

  .exp-angry .rb-eyes { display: none; }
  .exp-angry .rb-eyes-angry { display: block; }
  .exp-angry .rb-steam { display: block; }

  .exp-broken .rb-eyes { display: none; }
  .exp-broken .rb-eyes-cross { display: block; }

  .exp-offline .rb-eyes { display: none; }
  .exp-offline .rb-eyes-flat { display: block; }
  .exp-offline .rb-dangle { display: none; }
  .exp-offline { filter: grayscale(1) opacity(0.6); }

  @media (prefers-reduced-motion: no-preference) {
    .exp-angry .rb-steam { animation: rb-steam 0.85s ease-in-out infinite; }
  }
  body.reduce .exp-angry .rb-steam { animation: none; }
  @keyframes rb-steam {
    0%, 100% { opacity: 0.55; transform: translateY(0); }
    50%      { opacity: 1;    transform: translateY(-1.5px); }
  }

  /* ---- Speaking bubble (Figma yellow style) ---- */
  .tile.speaking .stage { height: 340px; align-items: flex-end; padding-bottom: 4px; overflow: visible; }
  .rb-bubble {
    position: absolute;
    left: 50%;
    top: 6px;
    transform: translateX(-50%);
    width: 178px;
    box-sizing: border-box;
    background: #FDB916;
    color: #000;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    font-weight: 700;
    font-size: 12.5px;
    line-height: 1.34;
    border-radius: 22px;
    padding: 15px 17px;
    text-align: left;
  }
  .rb-bubble .txt { margin: 0; min-height: 3.4em; }
  .rb-bubble .cursor {
    display: inline-block;
    width: 2px;
    height: 1em;
    margin-left: 1px;
    background: #000;
    vertical-align: -2px;
    animation: rb-caret 0.9s steps(1) infinite;
  }
  @keyframes rb-caret { 0%, 50% { opacity: 1; } 50.01%, 100% { opacity: 0; } }
  .rb-bubble.done .cursor { display: none; }
  .rb-bubble .lnk {
    display: inline-block;
    margin-top: 9px;
    text-decoration: underline;
    text-underline-offset: 2px;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.25s ease;
  }
  .rb-bubble.done .lnk { opacity: 1; }
  .rb-bubble .tail { position: absolute; bottom: -12px; left: 46%; }
</style>
</head>

  </svg>`;

  const grid = document.getElementById('grid');
  const tiles = STATES.map((s) => {
    const tile = document.createElement('section');
    tile.className = 'tile' + (s.key === 'speaking' ? ' speaking' : '') + (s.key === 'broken' ? ' broken' : '');
    tile.id = 'state-' + s.key;
    const robotHTML = s.key === 'broken'
      ? `<div class="robot-wrap broken-wrap">${BROKEN_SVG}<div class="tile-shadow"></div></div>`
      : `<div class="robot-wrap">${SVG}<div class="tile-shadow"></div></div>`;
    tile.innerHTML = `
      <div class="stage">
        ${s.key === 'speaking' ? BUBBLE_HTML : ''}
        ${robotHTML}
      </div>
      <div class="caption">
        <div class="name">${s.name}</div>
        <div class="note">${s.note}</div>
        <span class="cls">.exp-${s.key}</span>
      </div>`;
    grid.appendChild(tile);
    if (s.key === 'broken') return { key: s.key, still: true };  // fixed arrangement, no animation
    const svg = tile.querySelector('.rb-buddy');
    svg.classList.add('exp-' + s.key);
    const q = (c) => svg.querySelector('.' + c);
    return {
      key: s.key,
      svg,
      shadow: tile.querySelector('.tile-shadow'),
      head: q('rb-head'), eyes: q('rb-eyes'), antenna: q('rb-antenna'), body: q('rb-body'),
      armL: q('rb-armL'), armR: q('rb-armR'), dangle: q('rb-dangle'),
      phase: Math.random() * 1000,          // desync tiles so they don't move in lockstep
      blinkUntil: 0,
    };
  });

  const pauseBox = document.getElementById('pause');
  const reduceBox = document.getElementById('reduce');
  reduceBox.addEventListener('change', () => document.body.classList.toggle('reduce', reduceBox.checked));
  const systemReduce = window.matchMedia('(prefers-reduced-motion: reduce)');
  if (systemReduce.matches) { reduceBox.checked = true; document.body.classList.add('reduce'); }

  let t = 0;

  // Per-state motion — kept identical to the expression block in
  // robot-buddy.js frame(). Change numbers here first, review, then port.
  function animateTile(tile, now) {
    const p = tile.phase;
    const reduce = document.body.classList.contains('reduce');
    const T = t + p;

    let float = Math.sin(T * 0.06) * 3;
    let headExtraRot = 0, eyeLookYBias = 0, headTx = 0, headTy = 0, bodyRot = 0, buddyExtra = '';
    let armOverride = null, dangleXf = null;

    if (tile.key === 'thinking') {
      float *= 0.4;
      headExtraRot = Math.sin(T * 0.09) * 3.2;
      eyeLookYBias = -2.2;
    } else if (tile.key === 'speaking') {
      // Mouth animation removed with the legacy chin — a face mouth will be
      // added when we build the Speaking state. Gentle head bob for now.
      headExtraRot = reduce ? 0 : Math.sin(T * 0.4) * 0.8;
    } else if (tile.key === 'angry') {
      armOverride = [-30, 30];
      if (!reduce) buddyExtra = ` translate(${(Math.random() - 0.5) * 1.6}px, ${(Math.random() - 0.5) * 1.2}px)`;
    } else if (tile.key === 'broken') {
      // Disassembled — parts rotated apart to match Figma's collapsed layout.
      float = 0;
      headExtraRot = -38;   // head knocked askew
      headTx = -6; headTy = 3;
      bodyRot = -12;        // body tilted the other way
      armOverride = [-118, 150];  // arms flung out
      dangleXf = 'rotate(180deg) translate(0px, -4px)';  // hover jet flipped
    } else if (tile.key === 'offline') {
      float *= 0.15;
      headExtraRot = 7;
      armOverride = [24, -24];
    }

    if (reduce && tile.key !== 'broken' && tile.key !== 'offline') float = 0;

    // Idle liveliness shared by all states (stand-in for production's gaze).
    const idleLookX = reduce ? 0 : Math.sin(T * 0.02) * 1.0;

    // Blink
    if (!reduce && now > tile.blinkUntil && Math.random() < 0.004) tile.blinkUntil = now + 130;
    const blinking = !reduce && now < tile.blinkUntil;

    tile.svg.style.transform = `translateY(${-float}px)${buddyExtra}`;
    tile.shadow.style.transform = `scale(${1 - float * 0.03}, 1)`;
    tile.shadow.style.opacity = String(0.85 - Math.abs(float) * 0.04);

    tile.head.style.transform = `rotate(${headExtraRot}deg) translate(${idleLookX + headTx}px, ${headTy}px)`;
    tile.body.style.transform = bodyRot ? `rotate(${bodyRot}deg)` : '';
    tile.eyes.style.transform = `translate(${idleLookX * 1.5}px, ${eyeLookYBias}px) scaleY(${blinking ? 0.12 : 1})`;
    tile.antenna.style.transform = reduce ? 'none' : `rotate(${Math.sin(T * 0.07) * 2}deg)`;

    const sway = reduce ? 0 : Math.sin(T * 0.05) * 2.2;
    if (tile.key === 'speaking') {
      // Left arm raised — vertical flip pivoted at the SHOULDER so it stays
      // attached to the body and lifts up naturally (not flipped in place).
      tile.armL.style.transformOrigin = '5.43px 52px';
      tile.armL.style.transform = 'scaleY(-1)';
      tile.armR.style.transform = `rotate(${-sway}deg)`;
    } else if (armOverride) {
      tile.armL.style.transform = `rotate(${armOverride[0]}deg)`;
      tile.armR.style.transform = `rotate(${armOverride[1]}deg)`;
    } else {
      tile.armL.style.transform = `rotate(${sway}deg)`;
      tile.armR.style.transform = `rotate(${-sway}deg)`;
    }
    tile.dangle.style.transform = dangleXf ? dangleXf : (reduce ? 'none' : `rotate(${Math.sin(T * 0.06) * 2.5}deg)`);
  }

  function frame(now) {
    if (!pauseBox.checked) {
      t += 1;
      tiles.forEach((tile) => { if (!tile.still) animateTile(tile, now); });
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // Looping typewriter for the speaking bubble.
  (function typeLoop() {
    const bubble = document.querySelector('.tile.speaking .rb-bubble');
    if (!bubble) return;
    const typed = bubble.querySelector('.typed');
    const full = "Hello, it's nice to meet you. How's your day going?";
    let state = 'typing', idx = 0, nextAt = 0;
    function loop(now) {
      if (!pauseBox.checked) {
        if (state === 'typing') {
          if (now >= nextAt) {
            idx += 1;
            typed.textContent = full.slice(0, idx);
            nextAt = now + 42 + Math.random() * 45;
            if (idx >= full.length) { state = 'hold'; nextAt = now + 2400; bubble.classList.add('done'); }
          }
        } else if (state === 'hold') {
          if (now >= nextAt) { state = 'reset'; nextAt = now + 500; }
        } else if (state === 'reset') {
          if (now >= nextAt) {
            typed.textContent = ''; idx = 0; bubble.classList.remove('done');
            state = 'typing'; nextAt = now + 350;
          }
        }
      }
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  })();
})();
</script>
</body>
</html>
